<svg width="960" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: white;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
